<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c8ff32; text-decoration: none; }
    a:hover { color: #f4f3ed; }
    @media (prefers-reduced-motion: no-preference) {
      .rise { opacity: 0; animation: riseIn .9s cubic-bezier(.2,.8,.2,1) forwards; }
      .signal { opacity: 0; animation: signalIn .5s cubic-bezier(.2,.8,.2,1) 1.15s forwards; }
    }
    @keyframes riseIn { from { opacity: 0; transform: translateY(34px); } to { opacity: 1; transform: none; } }
    @keyframes signalIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  </style>
</helmet>

<div style="width: 1440px; background: #0a0c0b; color: #f4f3ed; font-family: Geist, Arial, sans-serif; overflow: hidden">

  <nav style="height: 82px; padding: 0 84px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333733">
    <span style="display: inline-flex; align-items: center; gap: 9px">
      <svg viewBox="0 0 150 209" width="31" height="43" fill="currentColor" aria-hidden="true" focusable="false" style="display: block">
        <path d="M19,0 L100,0 A50,50 0 0 1 100,100 L19,100 A19,19 0 0 1 0,81 L0,19 A19,19 0 0 1 19,0 Z" />
        <path d="M19,109 L100,109 A50,50 0 0 1 100,209 L19,209 A19,19 0 0 1 0,190 L0,128 A19,19 0 0 1 19,109 Z" />
      </svg>
      <b style="font-size: 14px; font-weight: 900; letter-spacing: .27em">BACKED</b>
      <em style="color: #c8ff32; font-style: normal; margin-left: -8px; font-size: 14px; font-weight: 900">.</em>
    </span>
    <span style="font-size: 11px; font-weight: 800; letter-spacing: .13em; color: #a5aaa4">PROOF VERIFIED &middot; 30 JUNE</span>
  </nav>

  <main style="position: relative; padding: 235px 84px 96px">

    <div style="position: absolute; inset: 0 0 auto; height: 470px; z-index: 0; display: flex; align-items: flex-start; justify-content: center">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
        <div style="position: relative; z-index: {{p.z}}; flex: 0 0 auto; width: {{p.w}}px; height: {{p.h}}px; margin-top: {{p.top}}px; margin-left: {{p.ml}}px; background: {{p.bg}}; border-radius: {{p.dome}}px {{p.dome}}px 10px 10px; color: #0a0c0b; display: flex; flex-direction: column; align-items: center; gap: 9px; padding-top: {{p.pad}}px; animation-delay: {{p.delay}}s" class="rise">
          <sc-if value="{{p.named}}" hint-placeholder-val="{{ true }}">
            <b style="font-size: {{p.fs}}px; font-weight: 900; letter-spacing: -.04em; line-height: 1">{{p.initial}}</b>
            <span style="font-size: 10.4px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em">{{p.name}}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="position: absolute; inset: 0 0 auto; height: 470px; z-index: 1; background: linear-gradient(180deg, rgba(10,12,11,0) 0%, rgba(10,12,11,.10) 20%, rgba(10,12,11,.70) 38%, #0a0c0b 49%)"></div>

    <div style="position: relative; z-index: 2; text-align: center">

      <p class="rise" style="margin: 0 0 26px; font-size: 11px; font-weight: 800; letter-spacing: .13em; color: #a5aaa4; animation-delay: .45s">RUN MY FIRST HALF MARATHON</p>

      <h1 class="rise" style="margin: 0 0 24px; font-size: 192px; line-height: .77; letter-spacing: -.08em; font-weight: 900; animation-delay: .55s">YOU DID IT<span class="signal" style="color: #c8ff32; display: inline-block">.</span></h1>

      <p class="rise" style="margin: 0 0 46px; font-size: 28px; font-weight: 700; letter-spacing: -.02em; animation-delay: .7s">Promise kept.</p>

      <strong class="rise" style="display: block; color: #c8ff32; font-size: 208px; line-height: .8; letter-spacing: -.08em; font-weight: 900; animation-delay: .8s">{{totalLabel}}</strong>
      <span class="rise" style="display: block; margin-top: 10px; font-size: 24px; font-weight: 750; letter-spacing: -.02em; animation-delay: .88s">Backing released.</span>

      <div class="rise" style="margin-top: 54px; border-top: 1px solid #383c38; padding-top: 26px; display: flex; justify-content: center; gap: 56px; flex-wrap: wrap; animation-delay: .96s">
        <sc-for list="{{roll}}" as="r" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 7px">
            <span style="font-size: 10.4px; font-weight: 800; letter-spacing: .12em; color: #a5aaa4">{{r.name}}</span>
            <b style="font-size: 17px; font-weight: 800; letter-spacing: -.02em">{{r.amount}}</b>
          </div>
        </sc-for>
        <sc-if value="{{hasMore}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 7px">
            <span style="font-size: 10.4px; font-weight: 800; letter-spacing: .12em; color: #a5aaa4">AND</span>
            <b style="font-size: 17px; font-weight: 800; letter-spacing: -.02em; color: #a5aaa4">{{moreLabel}}</b>
          </div>
        </sc-if>
      </div>

      <div class="rise" style="margin-top: 46px; display: flex; justify-content: center; gap: 12px; animation-delay: 1.04s">
        <button style="min-height: 58px; padding: 0 22px; display: inline-flex; align-items: center; justify-content: space-between; gap: 42px; font-weight: 850; font-size: 12.5px; letter-spacing: .05em; border: 1px solid #0a0c0b; background: #c8ff32; color: #0a0c0b; font-family: inherit; cursor: pointer">
          SHARE WHAT HAPPENED
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="flex-shrink: 0">
            <line x1="4" y1="12" x2="20" y2="12" />
            <polyline points="13 5 20 12 13 19" />
          </svg>
        </button>
        <button style="min-height: 58px; padding: 0 30px; display: inline-flex; align-items: center; font-weight: 850; font-size: 12.5px; letter-spacing: .05em; border: 1px solid #f4f3ed; background: transparent; color: #f4f3ed; font-family: inherit; cursor: pointer">
          SEE THE PROMISE
        </button>
      </div>

    </div>
  </main>
</div>
</x-dc>

<script data-dc-script data-props='{"backerCount":{"editor":"range","default":5,"min":3,"max":14,"step":1,"unit":" backers","section":"Composition"}}'>
class Component extends DCLogic {
  renderVals() {
    const BACKERS = [
      { name: 'MATTHEW', amount: 250 },
      { name: 'MUM', amount: 200 },
      { name: 'DAD', amount: 500 },
      { name: 'SARAH', amount: 100 },
      { name: 'ALEX', amount: 50 }
    ];
    const n = Math.max(3, Math.min(14, this.props.backerCount ?? 5));
    const mid = (n - 1) / 2;
    // Bigger crowds pack tighter and stand smaller, so 3 people read as an
    // intimate group and 14 as a field, per the Wall of Belief composition
    // bands in the Master Spec (1-5 intimate, 6-15 small group, 16+ crowd).
    const maxW = n > 9 ? 140 : n > 6 ? 165 : 200;
    const overlap = Math.round(maxW * (n > 9 ? 0.3 : n > 6 ? 0.2 : 0.13));

    // Nearest figures (the ones at the edges of the arc) are the individuated,
    // named backers; anyone further back reads as crowd.
    const slots = [];
    for (let i = 0; i < n; i++) slots.push(i);
    slots.sort((a, b) => Math.abs(b - mid) - Math.abs(a - mid));
    const nameFor = {};
    slots.slice(0, BACKERS.length).forEach((slot, k) => { nameFor[slot] = BACKERS[k]; });

    const people = [];
    for (let i = 0; i < n; i++) {
      const d = mid === 0 ? 0 : Math.abs(i - mid) / mid;
      const scale = 0.78 + 0.22 * d;
      const person = nameFor[i];
      const w = Math.round(maxW * scale);
      people.push({
        w: w,
        h: Math.round(maxW * 2.07 * scale),
        // Edges sit high and near, the centre drops back and away, so the arc
        // cradles the headline instead of reading as a row of equal figures.
        top: Math.round(30 + 30 * (1 - d)),
        // Figures overlap and the nearer ones sit in front: that, not spacing,
        // is what makes a row of shapes read as a crowd standing behind you.
        ml: i === 0 ? 0 : -overlap,
        z: Math.round(d * 10) + 1,
        dome: Math.round(w / 2),
        pad: Math.round(maxW * 0.14),
        fs: Math.round(maxW * 0.26),
        bg: d > 0.66 ? '#d7d8cf' : d > 0.33 ? '#8e948e' : '#848a84',
        delay: Math.round((0.08 + (1 - d) * 0.22) * 100) / 100,
        named: Boolean(person),
        initial: person ? person.name.charAt(0) : '',
        name: person ? person.name : ''
      });
    }

    const counted = BACKERS.slice(0, Math.min(n, BACKERS.length));
    const total = counted.reduce((sum, b) => sum + b.amount, 0) + Math.max(0, n - BACKERS.length) * 150;

    return {
      people,
      totalLabel: '$' + total.toLocaleString('en-US'),
      roll: counted.map((b) => ({ name: b.name, amount: '$' + b.amount.toLocaleString('en-US') })),
      hasMore: n > BACKERS.length,
      moreLabel: (n - BACKERS.length) + ' MORE'
    };
  }
}
</script>
</body>
</html>
