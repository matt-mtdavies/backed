<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c8ff32; text-decoration: none; }
    a:hover { color: #f4f3ed; }
    @media (prefers-reduced-motion: no-preference) {
      .rise { opacity: 0; animation: riseIn .9s cubic-bezier(.2,.8,.2,1) forwards; }
      .signal { opacity: 0; animation: signalIn .5s cubic-bezier(.2,.8,.2,1) 1.15s forwards; }
    }
    @keyframes riseIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
    @keyframes signalIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  </style>
</helmet>

<div style="width: 390px; background: #0a0c0b; color: #f4f3ed; font-family: Geist, Arial, sans-serif; overflow: hidden">

  <nav style="height: 74px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333733">
    <span style="display: inline-flex; align-items: center; gap: 8px">
      <svg viewBox="0 0 150 209" width="26" height="36" fill="currentColor" aria-hidden="true" focusable="false" style="display: block">
        <path d="M19,0 L100,0 A50,50 0 0 1 100,100 L19,100 A19,19 0 0 1 0,81 L0,19 A19,19 0 0 1 19,0 Z" />
        <path d="M19,109 L100,109 A50,50 0 0 1 100,209 L19,209 A19,19 0 0 1 0,190 L0,128 A19,19 0 0 1 19,109 Z" />
      </svg>
      <b style="font-size: 13px; font-weight: 900; letter-spacing: .27em">BACKED</b>
      <em style="color: #c8ff32; font-style: normal; margin-left: -7px; font-size: 13px; font-weight: 900">.</em>
    </span>
    <span style="font-size: 10px; font-weight: 800; letter-spacing: .13em; color: #a5aaa4">PROOF VERIFIED</span>
  </nav>

  <main style="position: relative; padding: 112px 20px 56px">

    <div style="position: absolute; inset: 0 0 auto; height: 210px; z-index: 0; display: flex; align-items: flex-start; justify-content: center">
      <div class="rise" style="position: relative; z-index: 11; flex: 0 0 auto; width: 85px; height: 176px; margin-top: 13px; background: #d7d8cf; border-radius: 43px 43px 6px 6px; color: #0a0c0b; display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 12px; animation-delay: .08s">
        <b style="font-size: 22px; font-weight: 900; letter-spacing: -.04em; line-height: 1">M</b>
      </div>
      <div class="rise" style="position: relative; z-index: 6; flex: 0 0 auto; width: 76px; height: 157px; margin-top: 19px; margin-left: -11px; background: #8e948e; border-radius: 38px 38px 6px 6px; color: #0a0c0b; display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 12px; animation-delay: .19s">
        <b style="font-size: 20px; font-weight: 900; letter-spacing: -.04em; line-height: 1">M</b>
      </div>
      <div class="rise" style="position: relative; z-index: 1; flex: 0 0 auto; width: 66px; height: 137px; margin-top: 26px; margin-left: -11px; background: #848a84; border-radius: 33px 33px 6px 6px; color: #0a0c0b; display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 12px; animation-delay: .3s">
        <b style="font-size: 18px; font-weight: 900; letter-spacing: -.04em; line-height: 1">D</b>
      </div>
      <div class="rise" style="position: relative; z-index: 6; flex: 0 0 auto; width: 76px; height: 157px; margin-top: 19px; margin-left: -11px; background: #8e948e; border-radius: 38px 38px 6px 6px; color: #0a0c0b; display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 12px; animation-delay: .19s">
        <b style="font-size: 20px; font-weight: 900; letter-spacing: -.04em; line-height: 1">S</b>
      </div>
      <div class="rise" style="position: relative; z-index: 11; flex: 0 0 auto; width: 85px; height: 176px; margin-top: 13px; margin-left: -11px; background: #d7d8cf; border-radius: 43px 43px 6px 6px; color: #0a0c0b; display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 12px; animation-delay: .08s">
        <b style="font-size: 22px; font-weight: 900; letter-spacing: -.04em; line-height: 1">A</b>
      </div>
    </div>

    <div style="position: absolute; inset: 0 0 auto; height: 210px; z-index: 1; background: linear-gradient(180deg, rgba(10,12,11,0) 0%, rgba(10,12,11,.10) 20%, rgba(10,12,11,.70) 38%, #0a0c0b 49%)"></div>

    <div style="position: relative; z-index: 2; text-align: center">

      <p class="rise" style="margin: 0 0 20px; font-size: 10px; font-weight: 800; letter-spacing: .13em; color: #a5aaa4; animation-delay: .45s">RUN MY FIRST HALF MARATHON</p>

      <h1 class="rise" style="margin: 0 0 20px; font-size: 80px; line-height: .77; letter-spacing: -.08em; font-weight: 900; animation-delay: .55s">YOU DID IT<span class="signal" style="color: #c8ff32; display: inline-block">.</span></h1>

      <p class="rise" style="margin: 0 0 34px; font-size: 24px; font-weight: 700; letter-spacing: -.02em; animation-delay: .7s">Promise kept.</p>

      <strong class="rise" style="display: block; color: #c8ff32; font-size: 96px; line-height: .8; letter-spacing: -.08em; font-weight: 900; animation-delay: .8s">$1,100</strong>
      <span class="rise" style="display: block; margin-top: 10px; font-size: 18px; font-weight: 750; letter-spacing: -.02em; animation-delay: .88s">Backing released.</span>

      <p class="rise" style="margin: 40px 0 0; border-top: 1px solid #383c38; padding-top: 22px; font-size: 10.4px; font-weight: 800; letter-spacing: .12em; color: #a5aaa4; line-height: 1.6; animation-delay: .96s">MATTHEW &middot; MUM &middot; DAD &middot; SARAH &middot; ALEX</p>

      <div class="rise" style="margin-top: 36px; display: flex; flex-direction: column; gap: 12px; animation-delay: 1.04s">
        <button style="min-height: 58px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-weight: 850; font-size: 12.5px; letter-spacing: .05em; border: 1px solid #0a0c0b; background: #c8ff32; color: #0a0c0b; font-family: inherit; cursor: pointer; width: 100%">
          SHARE WHAT HAPPENED
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="flex-shrink: 0">
            <line x1="4" y1="12" x2="20" y2="12" />
            <polyline points="13 5 20 12 13 19" />
          </svg>
        </button>
        <button style="min-height: 52px; padding: 0 22px; display: flex; align-items: center; justify-content: center; font-weight: 850; font-size: 12.5px; letter-spacing: .05em; border: 1px solid #f4f3ed; background: transparent; color: #f4f3ed; font-family: inherit; cursor: pointer; width: 100%">
          SEE THE PROMISE
        </button>
      </div>

    </div>
  </main>
</div>
</x-dc>
</body>
</html>
